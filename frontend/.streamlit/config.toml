[server]
port = 8000
headless = true

[browser]
gatherUsageStats = false

[client]
# Masque la barre d'outils encombrante de Streamlit
toolbarMode = "minimal"
showErrorDetails = true

[theme]
# ==============================================================================
# Thème "Deep Cosmos & Modern Observatory" (Idéal pour NEO-Watch / NASA)
# ==============================================================================
base = "dark"
primaryColor = "#38bdf8"             # Cyan céleste lumineux (boutons, badges, focus)
backgroundColor = "#0b0f19"          # Noir cosmos profond (élégant, immersif et contrasté)
secondaryBackgroundColor = "#161f30" # Cartes de contenu, formulaires, filtres et sidebar
textColor = "#f8fafc"                # Blanc éclatant pour une lisibilité parfaite des données
font = "sans serif"                  # Typographie épurée et moderne

# Couleurs de statut harmonisées
redTextColor = "#fca5a5"
redBackgroundColor = "#450a0a"
greenTextColor = "#86efac"
greenBackgroundColor = "#052e16"
yellowTextColor = "#fde047"
yellowBackgroundColor = "#422006"

# Bordures et en-têtes de tableaux
dataframeBorderColor = "#1e293b"
dataframeHeaderBackgroundColor = "#1e293b"
